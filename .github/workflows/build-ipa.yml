name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'New iOS Build'
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package .ipa
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. জিপ ফাইল আনজিপ করা
      - name: Extract Source Archive if Present
        run: |
          echo "Checking for .zip archive files in repo..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting zip archive: $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE"
            echo "Extraction complete."
          fi

          PROJECT_FOUND=$(find . -name "ThreeOneOSFive.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_FOUND" ]; then
            PROJECT_FOUND=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          fi

          if [ -n "$PROJECT_FOUND" ]; then
            DIR_PATH=$(dirname "$PROJECT_FOUND")
            FILE_NAME=$(basename "$PROJECT_FOUND")
            echo "TARGET_DIR=$DIR_PATH" >> $GITHUB_ENV
            echo "TARGET_PROJECT=$FILE_NAME" >> $GITHUB_ENV
            echo "Found project at: $DIR_PATH / $FILE_NAME"
          else
            echo "TARGET_DIR=." >> $GITHUB_ENV
            echo "TARGET_PROJECT=ThreeOneOSFive.xcodeproj" >> $GITHUB_ENV
          fi

      # ২. Xcode সিলেক্ট করা
      - name: Select Xcode Version
        run: |
          echo "Configuring Xcode version..."
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      # ৩. sys/fileport.h এরর সমাধান (iPhoneOS SDK-তে হেডার ইনজেক্ট করা)
      - name: Provide Missing SDK Headers
        run: |
          IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          MACOSX_SDK=$(xcrun --sdk macosx --show-sdk-path)
          echo "iPhoneOS SDK path: $IPHONEOS_SDK"
          echo "MacOSX SDK path: $MACOSX_SDK"

          sudo mkdir -p "$IPHONEOS_SDK/usr/include/sys"

          if [ -f "$MACOSX_SDK/usr/include/sys/fileport.h" ]; then
            echo "Copying sys/fileport.h from MacOSX SDK..."
            sudo cp "$MACOSX_SDK/usr/include/sys/fileport.h" "$IPHONEOS_SDK/usr/include/sys/fileport.h"
          else
            echo "Creating standard sys/fileport.h header in iPhoneOS SDK..."
            sudo bash -c "cat << 'EOF' > \"$IPHONEOS_SDK/usr/include/sys/fileport.h\"
#ifndef _SYS_FILEPORT_H_
#define _SYS_FILEPORT_H_
#include <sys/cdefs.h>
#include <mach/port.h>
typedef mach_port_t fileport_t;
#define FILEPORT_NULL ((fileport_t)0)
__BEGIN_DECLS
int fileport_makeport(int, fileport_t *);
int fileport_makefd(fileport_t);
__END_DECLS
#endif
EOF"
          fi
          echo "✅ Header verified at: $IPHONEOS_SDK/usr/include/sys/fileport.h"

      # ৪. অ্যাপ্লিকেশন ডিরেক্ট বিল্ড
      - name: Build iOS Application
        run: |
          cd "${{ env.TARGET_DIR }}"
          TARGET_SCHEME="OGIOS"
          BUILD_OUT="$GITHUB_WORKSPACE/build_output"
          rm -rf "$BUILD_OUT"
          mkdir -p "$BUILD_OUT"

          echo "🚀 Building $TARGET_SCHEME for iOS (Release)..."
          set -o pipefail

          xcodebuild clean build \
            -project "${{ env.TARGET_PROJECT }}" \
            -scheme "$TARGET_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$BUILD_OUT" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="-w -Wno-error -Wno-int-conversion -Wno-implicit-function-declaration -Wno-incompatible-function-pointer-types -Wno-strict-prototypes" \
            OTHER_CPLUSPLUSFLAGS="-w -Wno-error" 2>&1 | tee xcodebuild.log || {
              echo "=========================================="
              echo "❌ Build failed! Showing compilation errors:"
              echo "=========================================="
              grep -C 4 -i "error:" xcodebuild.log | head -n 50 || tail -n 50 xcodebuild.log
              exit 1
            }

          echo "✅ Build succeeded! Files in build output directory:"
          ls -la "$BUILD_OUT"

      # ৫. Ad-Hoc Sign ও ফ্রেশ Payload প্যাকেজিং
      - name: Package App into .ipa
        run: |
          BUILD_OUT="$GITHUB_WORKSPACE/build_output"
          APP_DIR=$(find "$BUILD_OUT" -maxdepth 2 -name "*.app" | head -n 1)

          if [ -z "$APP_DIR" ]; then
            echo "❌ Error: Could not locate built .app bundle in $BUILD_OUT!"
            find "$BUILD_OUT"
            exit 1
          fi

          echo "✅ Found application bundle: $APP_DIR"

          # Ad-hoc sign so ESign recognizes valid Mach-O
          echo "🔏 Applying Ad-Hoc code signature..."
          codesign --force --deep --sign - "$APP_DIR" || echo "Ad-hoc signing notice"

          STAGING_DIR="$RUNNER_TEMP/ipa_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/Payload"

          cp -RH "$APP_DIR" "$STAGING_DIR/Payload/"
          chmod -R 755 "$STAGING_DIR/Payload/"

          OUTPUT_IPA="$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"
          mkdir -p "$GITHUB_WORKSPACE/output"
          rm -f "$OUTPUT_IPA"

          (
            cd "$STAGING_DIR"
            zip -qry "$OUTPUT_IPA" Payload
          )

          echo "🔍 Verifying .ipa internal structure:"
          unzip -l "$OUTPUT_IPA" | head -n 25

          echo "🎉 Successfully generated valid .ipa:"
          ls -lh "$OUTPUT_IPA"

      # ৬. Artifact আপলোড
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive_OGIOS
          path: output/ThreeOneOSFive_OGIOS.ipa
          retention-days: 14

      # ৭. GitHub Releases-এ অটোমেটিক আপলোড
      - name: Create GitHub Release & Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: output/ThreeOneOSFive_OGIOS.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 iOS Build Release
            - Target App: `OGIOS`
            - Commit: `${{ github.sha }}`
            - Format: Valid Ad-Hoc Signed .ipa (Compatible with ESign, TrollStore, AltStore, Sideloadly)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
