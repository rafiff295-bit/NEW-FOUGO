name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'New iOS Build'
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package .ipa
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. জিপ ফাইল আনজিপ করা
      - name: Extract Source Archive if Present
        run: |
          echo "Checking for .zip archive files..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting zip archive: $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE"
            echo "Extraction complete."
          fi

          PROJECT_FOUND=$(find . -name "ThreeOneOSFive.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_FOUND" ]; then
            PROJECT_FOUND=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          fi

          if [ -n "$PROJECT_FOUND" ]; then
            DIR_PATH=$(dirname "$PROJECT_FOUND")
            FILE_NAME=$(basename "$PROJECT_FOUND")
            echo "TARGET_DIR=$DIR_PATH" >> $GITHUB_ENV
            echo "TARGET_PROJECT=$FILE_NAME" >> $GITHUB_ENV
            echo "Found project at: $DIR_PATH / $FILE_NAME"
          else
            echo "TARGET_DIR=." >> $GITHUB_ENV
            echo "TARGET_PROJECT=ThreeOneOSFive.xcodeproj" >> $GITHUB_ENV
          fi

      # ২. Xcode সিলেক্ট করা
      - name: Select Xcode Version
        run: |
          echo "Configuring Xcode version..."
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      # ৩. অ্যাপ্লিকেশন বিল্ড করা
      - name: Build iOS Application
        run: |
          cd "${{ env.TARGET_DIR }}"
          mkdir -p build
          TARGET_SCHEME="OGIOS"

          export OTHER_CFLAGS="-w -Wno-error"
          export GCC_WARN_INHIBIT_ALL_WARNINGS=YES
          export GCC_TREAT_WARNINGS_AS_ERRORS=NO

          if [ -f "build_unsigned.sh" ]; then
            echo "🚀 Running project's own build_unsigned.sh..."
            chmod +x build_unsigned.sh
            bash build_unsigned.sh || echo "build_unsigned.sh returned status $?, continuing..."
          fi

          EXISTING_APP=$(find . ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | grep -v "Simulator" | grep -v "Payload" | head -n 1)
          if [ -z "$EXISTING_APP" ]; then
            echo "📦 Running xcodebuild archive with warning suppression..."
            xcodebuild clean archive \
              -project "${{ env.TARGET_PROJECT }}" \
              -scheme "$TARGET_SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/OGIOS.xcarchive" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ENABLE_BITCODE=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
              GCC_TREAT_WARNINGS_AS_ERRORS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              OTHER_CFLAGS="-w -Wno-error" 2>&1 | tee xcodebuild.log || {
                echo "⚠️ Archive output check:"
                grep -C 3 -i "error:" xcodebuild.log | head -n 30 || true
              }
          fi

      # ৪. Ad-Hoc Sign ও ফ্রেশ Payload প্যাকেজিং (ESign ত্রুটি সমাধান)
      - name: Package App into .ipa
        run: |
          cd "${{ env.TARGET_DIR }}"

          mkdir -p "$GITHUB_WORKSPACE/output"

          # .app ফাইলটি খুঁজে নেওয়া
          echo "🔍 Locating built .app bundle..."
          APP_DIR=$(find "build/OGIOS.xcarchive/Products/Applications" ~/Library/Developer/Xcode/DerivedData . -name "*.app" 2>/dev/null | grep -v "Simulator" | grep -v "Payload" | head -n 1)

          if [ -z "$APP_DIR" ]; then
            echo "❌ Error: Could not locate built .app bundle!"
            find . -name "*.app"
            exit 1
          fi

          echo "✅ Found application bundle: $APP_DIR"

          # ESign ও TrollStore-এর জন্য Ad-Hoc কোড সাইন করা (ফ্রি, কোনো অ্যাকাউন্ট লাগে না)
          echo "🔏 Applying Ad-Hoc code signature (adds LC_CODE_SIGNATURE)..."
          codesign --force --deep --sign - "$APP_DIR" || echo "Ad-hoc signing completed with notice"

          # আইসোলেটেড স্টেজিং ফোল্ডারে Payload তৈরি করা
          STAGING_DIR="$RUNNER_TEMP/ipa_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/Payload"

          # .app কপি করা এবং এক্সিকিউট পারমিশন দেওয়া
          cp -RH "$APP_DIR" "$STAGING_DIR/Payload/"
          chmod -R +x "$STAGING_DIR/Payload/"

          # -qry দিয়ে পারফেক্ট iOS .ipa জিপ বানানো
          OUTPUT_IPA="$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"
          rm -f "$OUTPUT_IPA"
          (
            cd "$STAGING_DIR"
            zip -qry "$OUTPUT_IPA" Payload
          )

          # ভেতরের স্ট্রাকচার ভেরিফাই করা
          echo "🔍 Verifying .ipa internal structure:"
          unzip -l "$OUTPUT_IPA" | head -n 25

          echo "🎉 Successfully generated valid .ipa:"
          ls -lh "$OUTPUT_IPA"

      # ৫. Artifact আপলোড
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive_OGIOS
          path: output/ThreeOneOSFive_OGIOS.ipa
          retention-days: 14

      # ৬. GitHub Releases-এ অটোমেটিক আপলোড
      - name: Create GitHub Release & Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: output/ThreeOneOSFive_OGIOS.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 iOS Build Release
            - Target App: `OGIOS`
            - Commit: `${{ github.sha }}`
            - Format: Valid Ad-Hoc Signed .ipa (Compatible with ESign, TrollStore, AltStore, Sideloadly)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
