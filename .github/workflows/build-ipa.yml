name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'New iOS Build'
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package .ipa
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. জিপ ফাইল আনজিপ এবং টার্গেট ডিরেক্টরি সেট করা
      - name: Extract Source Archive if Present
        run: |
          echo "Checking for .zip archive files..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting zip archive: $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE"
            echo "Extraction complete."
          fi

          PROJECT_FOUND=$(find . -name "ThreeOneOSFive.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_FOUND" ]; then
            PROJECT_FOUND=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          fi

          if [ -n "$PROJECT_FOUND" ]; then
            DIR_PATH=$(dirname "$PROJECT_FOUND")
            FILE_NAME=$(basename "$PROJECT_FOUND")
            echo "TARGET_DIR=$DIR_PATH" >> $GITHUB_ENV
            echo "TARGET_PROJECT=$FILE_NAME" >> $GITHUB_ENV
            echo "Found project at: $DIR_PATH / $FILE_NAME"
          else
            echo "TARGET_DIR=." >> $GITHUB_ENV
            echo "TARGET_PROJECT=ThreeOneOSFive.xcodeproj" >> $GITHUB_ENV
          fi

      - name: Select Xcode Version
        run: |
          echo "Configuring Xcode version..."
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      # ২. প্রোজেক্টের নিজস্ব স্ক্রিপ্ট চেক করা
      - name: Inspect Existing Build Scripts
        run: |
          cd "${{ env.TARGET_DIR }}"
          xcodebuild -list -project "${{ env.TARGET_PROJECT }}" || true

          if [ -f "build_unsigned.sh" ]; then
            echo "=== Found build_unsigned.sh ==="
            cat build_unsigned.sh
            echo "================================"
            chmod +x build_unsigned.sh
          fi

      # ৩. অ্যাপ্লিকেশন বিল্ড করা (প্রোজেক্টের অফিসিয়াল স্ক্রিপ্ট + ফলব্যাক)
      - name: Build iOS Application
        run: |
          cd "${{ env.TARGET_DIR }}"
          mkdir -p build
          TARGET_SCHEME="OGIOS"

          # পদ্ধতি ১: যদি প্রোজেক্টের নিজস্ব build_unsigned.sh থাকে, সেটি সরাসরি রান করবে
          if [ -f "build_unsigned.sh" ]; then
            echo "🚀 Executing project's own build_unsigned.sh..."
            bash build_unsigned.sh && echo "build_unsigned.sh finished successfully!" || echo "build_unsigned.sh exited, checking fallback..."
          fi

          # পদ্ধতি ২: যদি এখনও .ipa না পেয়ে থাকে, তবে xcodebuild দিয়ে বিল্ড করবে
          IPA_EXISTS=$(find . -maxdepth 2 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_EXISTS" ]; then
            echo "📦 Running xcodebuild archive..."
            xcodebuild clean archive \
              -project "${{ env.TARGET_PROJECT }}" \
              -scheme "$TARGET_SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/OGIOS.xcarchive" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ENABLE_BITCODE=NO \
              GCC_TREAT_WARNINGS_AS_ERRORS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO || {
                echo "⚠️ Archive failed, attempting direct build into DerivedData..."
                xcodebuild build \
                  -project "${{ env.TARGET_PROJECT }}" \
                  -scheme "$TARGET_SCHEME" \
                  -configuration Release \
                  -sdk iphoneos \
                  CODE_SIGN_IDENTITY="" \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGNING_ALLOWED=NO \
                  GCC_TREAT_WARNINGS_AS_ERRORS=NO
              }
          fi

      # ৪. .ipa তৈরি এবং সঠিক জায়গায় কপি করা
      - name: Package App into .ipa
        run: |
          cd "${{ env.TARGET_DIR }}"

          # ১. যদি build_unsigned.sh আগেই .ipa তৈরি করে ফেলে থাকে
          ALREADY_IPA=$(find . -maxdepth 3 -name "*.ipa" | head -n 1)
          if [ -n "$ALREADY_IPA" ]; then
            echo "✅ Found pre-built .ipa: $ALREADY_IPA"
            mkdir -p "$GITHUB_WORKSPACE/output"
            cp "$ALREADY_IPA" "$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"
            echo "Copied to output directory."
            ls -lh "$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"
            exit 0
          fi

          # ২. DerivedData এবং Archive উভয় জায়গায় .app খোঁজা
          echo "🔍 Searching for built .app bundle in all build locations..."
          APP_DIR=$(find "build/OGIOS.xcarchive/Products/Applications" ~/Library/Developer/Xcode/DerivedData . -name "*.app" 2>/dev/null | grep -v "Simulator" | head -n 1)

          if [ -z "$APP_DIR" ]; then
            echo "❌ Error: Could not locate built .app bundle!"
            echo "Searching all .app directories on runner:"
            find ~/Library/Developer/Xcode/DerivedData . -name "*.app" || true
            exit 1
          fi

          echo "✅ Found application bundle: $APP_DIR"

          # ৩. স্ট্যান্ডার্ড iOS Payload তৈরি করা
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_DIR" build/Payload/

          # ৪. জিপ করে .ipa বানানো
          (
            cd build
            zip -qr "ThreeOneOSFive_OGIOS.ipa" Payload
          )

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "build/ThreeOneOSFive_OGIOS.ipa" "$GITHUB_WORKSPACE/output/"

          echo "🎉 Successfully generated: output/ThreeOneOSFive_OGIOS.ipa"
          ls -lh "$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"

      # ৫. Artifact আপলোড
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive_OGIOS
          path: output/ThreeOneOSFive_OGIOS.ipa
          retention-days: 14

      # ৬. GitHub Releases-এ অটোমেটিক রিলিজ তৈরি ও .ipa অ্যাটাচ করা
      - name: Create GitHub Release & Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: output/ThreeOneOSFive_OGIOS.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 iOS Build Release
            - App Scheme: `OGIOS`
            - Commit: `${{ github.sha }}`
            - Build Type: Unsigned .ipa (Compatible with TrollStore, AltStore, Sideloadly)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
