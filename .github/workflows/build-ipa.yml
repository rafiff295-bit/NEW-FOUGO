name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'New iOS Build'
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package .ipa
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. Auto-Extract ZIP if present (e.g. Full source 3105 FOUGO.zip)
      - name: Extract Source Archive if Present
        run: |
          echo "Checking for .zip archive files in repo..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting zip archive: $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE"
            echo "Extraction complete."
          fi

          # Find where the .xcodeproj is located
          PROJECT_FOUND=$(find . -name "ThreeOneOSFive.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_FOUND" ]; then
            PROJECT_FOUND=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          fi

          if [ -n "$PROJECT_FOUND" ]; then
            DIR_PATH=$(dirname "$PROJECT_FOUND")
            FILE_NAME=$(basename "$PROJECT_FOUND")
            echo "TARGET_DIR=$DIR_PATH" >> $GITHUB_ENV
            echo "TARGET_PROJECT=$FILE_NAME" >> $GITHUB_ENV
            echo "Found project at: $DIR_PATH / $FILE_NAME"
          else
            echo "TARGET_DIR=." >> $GITHUB_ENV
            echo "TARGET_PROJECT=ThreeOneOSFive.xcodeproj" >> $GITHUB_ENV
          fi

      - name: Select Xcode Version
        run: |
          echo "Configuring Xcode version..."
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      # ২. Fix Missing Private Headers (sys/fileport.h for OPA334 kexploit)
      - name: Provide Missing SDK Headers
        run: |
          IPHONEOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iPhoneOS SDK path: $IPHONEOS_SDK"

          sudo mkdir -p "$IPHONEOS_SDK/usr/include/sys"

          # Write complete, valid sys/fileport.h (defines fileport_t, fileport_makeport, fileport_makefd)
          echo "" | base64 --decode | sudo tee "$IPHONEOS_SDK/usr/include/sys/fileport.h" > /dev/null

          # Also place in project source tree for reliable discovery
          mkdir -p "${{ env.TARGET_DIR }}/sys"
          cp "$IPHONEOS_SDK/usr/include/sys/fileport.h" "${{ env.TARGET_DIR }}/sys/fileport.h" || true

          echo "✅ Verified header contents:"
          cat "$IPHONEOS_SDK/usr/include/sys/fileport.h"

      # ৩. Build iOS App Binary (with Warning Inhibition & Direct Output Directory)
      - name: Build iOS Application
        run: |
          cd "${{ env.TARGET_DIR }}"
          TARGET_SCHEME="OGIOS"
          BUILD_OUT="$GITHUB_WORKSPACE/build_output"
          rm -rf "$BUILD_OUT"
          mkdir -p "$BUILD_OUT"
          xattr -w com.apple.xcode.CreatedByBuildSystem true "$BUILD_OUT" 2>/dev/null || true

          echo "🚀 Building $TARGET_SCHEME for iOS (Release)..."
          set -o pipefail

          # Build directly into CONFIGURATION_BUILD_DIR (omit 'clean' to prevent Xcode directory delete error)
          xcodebuild build \
            -project "${{ env.TARGET_PROJECT }}" \
            -scheme "$TARGET_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CONFIGURATION_BUILD_DIR="$BUILD_OUT" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            OTHER_CFLAGS="-w -Wno-error -Wno-int-conversion -Wno-implicit-function-declaration -Wno-incompatible-function-pointer-types -Wno-strict-prototypes" \
            OTHER_CPLUSPLUSFLAGS="-w -Wno-error" 2>&1 | tee xcodebuild.log || {
              echo "=========================================="
              echo "❌ Build failed! Showing compilation errors:"
              echo "=========================================="
              grep -C 4 -i "error:" xcodebuild.log | head -n 50 || tail -n 50 xcodebuild.log
              exit 1
            }

          echo "✅ Build succeeded! Files in build output directory:"
          ls -la "$BUILD_OUT"

      # ৪. Package into Valid Sideloadable .ipa (Ad-Hoc Signed & Symlink Preserved)
      - name: Package App into .ipa
        run: |
          BUILD_OUT="$GITHUB_WORKSPACE/build_output"
          APP_DIR=$(find "$BUILD_OUT" -maxdepth 2 -name "*.app" | head -n 1)

          if [ -z "$APP_DIR" ]; then
            echo "❌ Error: Could not locate built .app bundle in $BUILD_OUT!"
            find "$BUILD_OUT"
            exit 1
          fi

          echo "✅ Found application bundle: $APP_DIR"

          # Ad-hoc sign so ESign and iOS recognise valid Mach-O LC_CODE_SIGNATURE
          echo "🔏 Applying Ad-Hoc code signature..."
          codesign --force --deep --sign - "$APP_DIR" || echo "Ad-hoc signing notice"

          # Isolated staging directory
          STAGING_DIR="$RUNNER_TEMP/ipa_staging"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR/Payload"

          # Copy .app bundle into Payload/
          cp -RH "$APP_DIR" "$STAGING_DIR/Payload/"
          chmod -R 755 "$STAGING_DIR/Payload/"

          # Zip Payload into .ipa (with -qry for symlinks and valid zip header)
          OUTPUT_IPA="$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"
          mkdir -p "$GITHUB_WORKSPACE/output"
          rm -f "$OUTPUT_IPA"

          (
            cd "$STAGING_DIR"
            zip -qry "$OUTPUT_IPA" Payload
          )

          # Verify IPA internal structure
          echo "🔍 Verifying .ipa internal structure:"
          unzip -l "$OUTPUT_IPA" | head -n 25

          echo "🎉 Successfully generated valid .ipa:"
          ls -lh "$OUTPUT_IPA"

      # ৫. Upload Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive_OGIOS
          path: output/ThreeOneOSFive_OGIOS.ipa
          retention-days: 14

      # ৬. Create GitHub Release
      - name: Create GitHub Release & Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: output/ThreeOneOSFive_OGIOS.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 iOS Build Release
            - Target App: `OGIOS`
            - Commit: `${{ github.sha }}`
            - Format: Valid Ad-Hoc Signed .ipa (Compatible with ESign, TrollStore, AltStore, Sideloadly)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
