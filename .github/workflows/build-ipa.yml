name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*.*.*'
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title'
        required: false
        default: 'New iOS Build'
        type: string

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build & Package .ipa
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ১. জিপ ফাইল থাকলে স্বয়ংক্রিয়ভাবে এক্সট্রাক্ট করা
      - name: Extract Source Archive if Present
        run: |
          echo "Checking for .zip archive files..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting zip archive: $ZIP_FILE..."
            unzip -q -o "$ZIP_FILE"
            echo "Extraction complete."
          fi

          # ThreeOneOSFive.xcodeproj প্রজেক্ট ডিরেক্টরি লোকেট করা
          PROJECT_FOUND=$(find . -name "ThreeOneOSFive.xcodeproj" | head -n 1)
          if [ -z "$PROJECT_FOUND" ]; then
            PROJECT_FOUND=$(find . -name "*.xcodeproj" -o -name "*.xcworkspace" | head -n 1)
          fi

          if [ -n "$PROJECT_FOUND" ]; then
            DIR_PATH=$(dirname "$PROJECT_FOUND")
            FILE_NAME=$(basename "$PROJECT_FOUND")
            echo "TARGET_DIR=$DIR_PATH" >> $GITHUB_ENV
            echo "TARGET_PROJECT=$FILE_NAME" >> $GITHUB_ENV
            echo "Found project at: $DIR_PATH / $FILE_NAME"
          else
            echo "TARGET_DIR=." >> $GITHUB_ENV
            echo "TARGET_PROJECT=ThreeOneOSFive.xcodeproj" >> $GITHUB_ENV
          fi

      # ২. দ্রুততম Xcode ভার্সন লোড করা
      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* || true
          sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      # ৩. প্রজেক্টের অভ্যন্তরীণ স্ক্রিপ্ট পর্যবেক্ষণ
      - name: Inspect Existing Build Scripts
        run: |
          cd "${{ env.TARGET_DIR }}"
          xcodebuild -list -project "${{ env.TARGET_PROJECT }}" || true

          if [ -f "build_unsigned.sh" ]; then
            echo "=== Found build_unsigned.sh ==="
            cat build_unsigned.sh
            echo "================================"
            chmod +x build_unsigned.sh
          fi

      # ৪. অ্যাপ্লিকেশন বিল্ড (AppIconHelper ও DisplayIdentity এরর বাইপাস)
      - name: Build iOS Application
        run: |
          cd "${{ env.TARGET_DIR }}"
          mkdir -p build
          TARGET_SCHEME="OGIOS"

          export OTHER_CFLAGS="-w -Wno-error"
          export GCC_WARN_INHIBIT_ALL_WARNINGS=YES
          export GCC_TREAT_WARNINGS_AS_ERRORS=NO

          # ট্রাই ১: যদি প্রোজেক্টের নিজস্ব স্ক্রিপ্ট থাকে
          if [ -f "build_unsigned.sh" ]; then
            echo "🚀 Trying build_unsigned.sh..."
            bash build_unsigned.sh || echo "build_unsigned.sh exited with status $?, continuing to standard build..."
          fi

          # ট্রাই ২: ওয়ার্নিং সাপ্রেশন সহ আনসাইনড আর্কাইভ তৈরি
          EXISTING_APP=$(find . ~/Library/Developer/Xcode/DerivedData -name "*.app" 2>/dev/null | grep -v "Simulator" | head -n 1)
          if [ -z "$EXISTING_APP" ]; then
            echo "📦 Running xcodebuild archive with warning suppression..."
            xcodebuild clean archive \
              -project "${{ env.TARGET_PROJECT }}" \
              -scheme "$TARGET_SCHEME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "build/OGIOS.xcarchive" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              ENABLE_BITCODE=NO \
              COMPILER_INDEX_STORE_ENABLE=NO \
              GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
              GCC_TREAT_WARNINGS_AS_ERRORS=NO \
              SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
              OTHER_CFLAGS="-w -Wno-error" 2>&1 | tee xcodebuild.log || {
                echo "⚠️ Archive status check:"
                grep -C 3 -i "error:" xcodebuild.log | head -n 40 || tail -n 40 xcodebuild.log
              }
          fi

      # ৫. .ipa প্যাকেজ করা
      - name: Package App into .ipa
        run: |
          cd "${{ env.TARGET_DIR }}"

          # ১. যদি বিল্ড স্ক্রিপ্ট আগেই .ipa বানিয়ে থাকে
          ALREADY_IPA=$(find . -maxdepth 3 -name "*.ipa" | head -n 1)
          if [ -n "$ALREADY_IPA" ]; then
            echo "✅ Found pre-built .ipa: $ALREADY_IPA"
            mkdir -p "$GITHUB_WORKSPACE/output"
            cp "$ALREADY_IPA" "$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"
            echo "Copied to output directory."
            ls -lh "$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"
            exit 0
          fi

          # ২. DerivedData এবং Archive উভয় জায়গা থেকে .app ফাইল লোকেট করা
          echo "🔍 Searching for built .app bundle..."
          APP_DIR=$(find "build/OGIOS.xcarchive/Products/Applications" ~/Library/Developer/Xcode/DerivedData . -name "*.app" 2>/dev/null | grep -v "Simulator" | head -n 1)

          if [ -z "$APP_DIR" ]; then
            echo "❌ Error: Could not locate built .app bundle!"
            echo "Directory contents:"
            find . -maxdepth 3 -print
            exit 1
          fi

          echo "✅ Found application bundle: $APP_DIR"

          # ৩. স্ট্যান্ডার্ড Payload ডিরেক্টরি তৈরি
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_DIR" build/Payload/

          # ৪. জিপ করে .ipa বানানো
          (
            cd build
            zip -qr "ThreeOneOSFive_OGIOS.ipa" Payload
          )

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "build/ThreeOneOSFive_OGIOS.ipa" "$GITHUB_WORKSPACE/output/"

          echo "🎉 Successfully generated: output/ThreeOneOSFive_OGIOS.ipa"
          ls -lh "$GITHUB_WORKSPACE/output/ThreeOneOSFive_OGIOS.ipa"

      # ৬. Artifact আপলোড
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeOneOSFive_OGIOS
          path: output/ThreeOneOSFive_OGIOS.ipa
          retention-days: 14

      # ৭. GitHub Releases-এ অটোমেটিক আপলোড
      - name: Create GitHub Release & Upload IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: output/ThreeOneOSFive_OGIOS.ipa
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## 📱 iOS Build Release
            - Target Scheme: `OGIOS`
            - Commit: `${{ github.sha }}`
            - Build Type: Unsigned .ipa (Compatible with TrollStore, AltStore, Sideloadly)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
